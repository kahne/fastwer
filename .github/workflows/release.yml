name: Release to PyPI

on:
  pull_request:
    branches: ["master"]
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-version:
    name: Verify release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Match tag to VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag version $tag_version does not match VERSION $package_version" >&2
            exit 1
          fi

  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    # Only build the full matrix on tags; PRs are validated via verify-version + test.yml
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - macos-15-intel
          - macos-14

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build and test wheels
        uses: pypa/cibuildwheel@v4.2.0

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build-sdist:
    name: Build source distribution
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Build source distribution
        run: |
          python -m pip install --upgrade build
          python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  validate-artifacts:
    name: Validate distribution metadata
    needs: [build-wheels, build-sdist]
    # validate-artifacts should run only when build-wheels ran (i.e. on tags)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Check distributions
        run: |
          python -m pip install twine
          python -m twine check --strict dist/*

  publish:
    name: Publish to PyPI
    needs: [validate-artifacts]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fastwer
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: dist
          merge-multiple: true

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
