[build-system]
requires = ["setuptools", "pybind11", "wheel"]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
build = "cp38-*"
archs = ["auto64"]
test-sources = ["tests"]
test-command = "python -m unittest -v tests.basic"

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "10.14" }
